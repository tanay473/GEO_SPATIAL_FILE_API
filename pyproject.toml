[project]
name = "geo-spatial-file-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.3",
    "orjson>=3.13.0",
    "pydantic-settings>=2.15.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:pyogrio.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]
